<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 한가람 체육활동 포털</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- 상단 심플 내비게이션 -->
    <header class="bg-white shadow-sm">
        <div class="max-w-4xl mx-auto px-4 h-14 flex justify-between items-center">
            <h1 class="font-bold text-base text-slate-900 cursor-pointer" onclick="switchTab('home')">
                <i class="fa-solid fa-medal text-blue-500 mr-1.5"></i> 한가람 체육활동
            </h1>
            <nav class="space-x-1 sm:space-x-2 text-xs font-medium">
                <button onclick="switchTab('home')" class="tab-btn px-3 py-1.5 rounded-md bg-slate-900 text-white">안내</button>
                <button onclick="switchTab('score')" class="tab-btn px-3 py-1.5 rounded-md hover:bg-slate-100 text-slate-600">점수판</button>
                <button onclick="switchTab('board')" class="tab-btn px-3 py-1.5 rounded-md hover:bg-slate-100 text-slate-600">게시판</button>
                <button onclick="switchTab('chat')" class="tab-btn px-3 py-1.5 rounded-md hover:bg-slate-100 text-slate-600">소통방</button>
                <button onclick="switchTab('tools')" class="tab-btn px-3 py-1.5 rounded-md hover:bg-slate-100 text-slate-600">도구함</button>
            </nav>
        </div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full space-y-4">

        <!-- 1. 홈(안내) 탭 -->
        <div id="content-home" class="bg-white p-6 rounded-xl shadow-sm space-y-4">
            <h2 class="text-lg font-bold text-slate-900">2026학년도 한가람 체육활동 안내</h2>
            <p class="text-xs text-slate-600 leading-relaxed">안전하고 즐거운 체육활동 진행을 위한 정보 안내 페이지입니다[cite: 6].</p>
            
            <div class="bg-slate-50 p-4 rounded-lg space-y-2 text-xs">
                <div class="flex justify-between border-b border-slate-200 pb-2">
                    <span class="font-bold text-slate-700">일시</span>
                    <span class="text-slate-600">2026. 10. 16. (금) 09:00 ~ 15:00[cite: 1, 6]</span>
                </div>
                <div class="flex justify-between border-b border-slate-200 pb-2">
                    <span class="font-bold text-slate-700">장소</span>
                    <span class="text-slate-600">본교 운동장 및 체육관[cite: 6]</span>
                </div>
                <div class="flex justify-between pt-1">
                    <span class="font-bold text-slate-700">참고사항</span>
                    <span class="text-slate-600">찬조금 및 간식 제공 일절 없음[cite: 6]</span>
                </div>
            </div>
        </div>

        <!-- 2. 점수판 탭 -->
        <div id="content-score" class="hidden bg-white p-6 rounded-xl shadow-sm space-y-4">
            <h2 class="text-lg font-bold text-slate-900">실시간 점수 집계</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-blue-50 border border-blue-100 p-4 rounded-lg text-center space-y-2">
                    <div class="font-bold text-blue-600 text-sm">청 팀</div>
                    <div class="text-4xl font-black text-blue-700" id="score-blue">0</div>
                    <div class="space-x-1">
                        <button onclick="updateScore('blue', -10)" class="bg-white border border-blue-200 px-2.5 py-1 rounded text-xs font-bold text-blue-600">-10</button>
                        <button onclick="updateScore('blue', 10)" class="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold">+10</button>
                    </div>
                </div>
                <div class="bg-rose-50 border border-rose-100 p-4 rounded-lg text-center space-y-2">
                    <div class="font-bold text-rose-600 text-sm">백 팀</div>
                    <div class="text-4xl font-black text-rose-700" id="score-white">0</div>
                    <div class="space-x-1">
                        <button onclick="updateScore('white', -10)" class="bg-white border border-rose-200 px-2.5 py-1 rounded text-xs font-bold text-rose-600">-10</button>
                        <button onclick="updateScore('white', 10)" class="bg-rose-600 text-white px-3 py-1 rounded text-xs font-bold">+10</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. 게시판 탭 -->
        <div id="content-board" class="hidden bg-white p-6 rounded-xl shadow-sm space-y-4">
            <h2 class="text-lg font-bold text-slate-900">자유 게시판</h2>
            <form onsubmit="writePost(event)" class="space-y-3 bg-slate-50 p-4 rounded-lg border border-slate-200 text-xs">
                <div class="flex gap-2">
                    <input type="text" id="post-author" placeholder="작성자" required class="flex-1 bg-white border border-slate-300 rounded px-3 py-1.5 outline-none">
                    <label class="flex items-center space-x-1 cursor-pointer">
                        <input type="checkbox" id="post-anon" onchange="toggleAnon()">
                        <span>익명</span>
                    </label>
                </div>
                <input type="text" id="post-title" placeholder="제목" required class="w-full bg-white border border-slate-300 rounded px-3 py-1.5 outline-none">
                <textarea id="post-content" placeholder="내용을 입력하세요..." rows="2" required class="w-full bg-white border border-slate-300 rounded px-3 py-1.5 outline-none"></textarea>
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2 rounded">글 등록</button>
            </form>
            <div id="post-list" class="space-y-2 text-xs">
                <div class="text-center text-slate-400 py-6">등록된 게시글이 없습니다.</div>
            </div>
        </div>

        <!-- 4. 소통방 탭 -->
        <div id="content-chat" class="hidden bg-white p-6 rounded-xl shadow-sm space-y-4">
            <h2 class="text-lg font-bold text-slate-900">실시간 소통방</h2>
            <div class="flex items-center space-x-2 text-xs bg-slate-50 p-2 rounded border border-slate-200">
                <span class="font-bold">내 닉네임:</span>
                <input type="text" id="chat-nickname" placeholder="닉네임 입력" class="flex-1 bg-white border border-slate-300 rounded px-2 py-1 outline-none">
                <button onclick="saveNick()" class="bg-slate-900 text-white px-3 py-1 rounded font-bold">저장</button>
            </div>
            <div class="bg-sky-100 border border-slate-300 rounded-lg p-3 h-64 flex flex-col justify-between">
                <div id="chat-messages" class="overflow-y-auto space-y-2 pr-1 text-xs">
                    <div class="text-center text-slate-500 text-[11px] my-1">소통방에 입장했습니다.</div>
                </div>
                <div class="flex gap-2 pt-2 border-t border-slate-300">
                    <input type="text" id="chat-input" placeholder="메시지 입력..." class="flex-1 bg-white border border-slate-300 rounded px-3 py-1.5 text-xs outline-none" onkeypress="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()" class="bg-yellow-400 font-bold px-4 py-1.5 rounded text-xs">전송</button>
                </div>
            </div>
        </div>

        <!-- 5. 도구함 탭 -->
        <div id="content-tools" class="hidden bg-white p-6 rounded-xl shadow-sm space-y-4">
            <h2 class="text-lg font-bold text-slate-900">편의 도구함</h2>
            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3 text-xs">
                <div class="font-bold text-slate-700">랜덤 추첨기</div>
                <input type="text" id="tool-names" placeholder="이름을 쉼표(,)로 구분하여 입력" class="w-full bg-white border border-slate-300 rounded px-3 py-1.5 outline-none">
                <button onclick="runRandom()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2 rounded">추첨 실행</button>
                <div id="tool-result" class="text-center font-bold text-blue-600 text-sm"></div>
            </div>
        </div>

    </main>

    <!-- 푸터 -->
    <footer class="text-center py-4 text-xs text-slate-400">
        <p>&copy; 2026 한가람 체육활동 포털</p>
    </footer>

    <!-- 자바스크립트 로직 -->
    <script>
        function switchTab(tabId) {
            ['home', 'score', 'board', 'chat', 'tools'].forEach(id => {
                document.getElementById('content-' + id).classList.add('hidden');
            });
            document.getElementById('content-' + tabId).classList.remove('hidden');

            document.querySelectorAll('nav button').forEach(btn => {
                btn.className = "tab-btn px-3 py-1.5 rounded-md hover:bg-slate-100 text-slate-600";
            });
            event.target.className = "tab-btn px-3 py-1.5 rounded-md bg-slate-900 text-white";
        }

        let scores = { blue: 0, white: 0 };
        function updateScore(team, val) {
            scores[team] = Math.max(0, scores[team] + val);
            document.getElementById('score-' + team).innerText = scores[team];
        }

        function toggleAnon() {
            const isAnon = document.getElementById('post-anon').checked;
            const authorInput = document.getElementById('post-author');
            authorInput.value = isAnon ? '익명' : '';
            authorInput.disabled = isAnon;
        }

        function writePost(event) {
            event.preventDefault();
            const author = document.getElementById('post-author').value;
            const title = document.getElementById('post-title').value;
            const content = document.getElementById('post-content').value;
            const list = document.getElementById('post-list');

            if (list.querySelector('.text-center')) {
                list.innerHTML = '';
            }

            const item = document.createElement('div');
            item.className = "bg-slate-50 border border-slate-200 p-3 rounded-lg space-y-1";
            item.innerHTML = `
                <div class="flex justify-between font-bold text-slate-700">
                    <span>${title}</span>
                    <span class="text-slate-400 font-normal">${author}</span>
                </div>
                <p class="text-slate-600">${content}</p>
            `;
            list.prepend(item);
            event.target.reset();
            document.getElementById('post-author').disabled = false;
        }

        function saveNick() {
            const nick = document.getElementById('chat-nickname').value.trim();
            if(!nick) return alert("닉네임을 입력하세요.");
            localStorage.setItem('user_nick', nick);
            alert("닉네임이 저장되었습니다.");
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;
            const nick = localStorage.getItem('user_nick') || '방문자';
            const box = document.getElementById('chat-messages');

            const msg = document.createElement('div');
            msg.className = "flex flex-col items-end space-y-0.5";
            msg.innerHTML = `
                <span class="text-[10px] text-slate-600 font-bold">${nick}</span>
                <div class="bg-yellow-300 text-slate-900 px-3 py-1.5 rounded-lg max-w-xs shadow-sm">${text}</div>
            `;
            box.appendChild(msg);
            input.value = '';
            box.scrollTop = box.scrollHeight;
        }

        function runRandom() {
            const val = document.getElementById('tool-names').value;
            const arr = val.split(',').map(s => s.trim()).filter(s => s);
            if(arr.length === 0) return alert("이름을 입력해주세요.");
            const picked = arr[Math.floor(Math.random() * arr.length)];
            document.getElementById('tool-result').innerText = `결과: [ ${picked} ]`;
        }
    </script>
</body>
</html>
